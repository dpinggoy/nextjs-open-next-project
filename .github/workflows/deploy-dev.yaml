name: Deploy Dev

on:
    push:
        branches: [dev]
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: development

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - run: npm run build

            - run: npm run build:open-next

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - run: npm run cdk:deploy:dev

            - name: Get CloudFront Distribution ID
              id: cloudfront
              run: |
                  URL=$(aws cloudformation describe-stacks \
                    --stack-name nextjs-dev \
                    --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontURL`].OutputValue' \
                    --output text)
                    echo "url=$URL" >> $GITHUB_OUTPUT

                  # Extract CloudFront domain from URL
                  DOMAIN=$(echo $URL | sed 's|https://||' | sed 's|http://||')

                  # Get Distribution ID using the domain name
                  DISTRIBUTION_ID=$(aws cloudfront list-distributions \
                    --query "DistributionList.Items[?DomainName=='$DOMAIN'].Id | [0]" \
                    --output text)
                   
                 echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
                 echo "Distribution ID $DISTRIBUTION_ID"
                 echo "CloudFront URL $URL"

            - name: Invalidate CloudFront Cache
              if: steps.cloudfront.outputs.distribution_id != 'None' && steps.cloudfront.outputs.distribution_id != ''
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id ${{ steps.cloudfront.outputs.distribution_id }} \
                    --paths "/*"
                  echo "✅ Cache invalidated"

            - name: Show deployment URL
              run: echo "🌎 Application deployed at ${{ steps.cloudfront.outputs.url }}"
