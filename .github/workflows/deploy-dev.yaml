name: Deploy Dev

on:
    push:
        branches: [dev]
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: development

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npx tsc --noEmit

            - name: Test
              run: npm test
              continue-on-error: true

            - run: npm run build

            - run: npm run build:open-next

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - run: npm run cdk:deploy:dev

            - name: Invalidate CloudFront cache
              run: |
                  DIST_ID=$(aws cloudfront list-distributions --query 'DistributionList.Items[0].Id' --output text)
                  aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
                  echo "Cache invalidated for distribution $DIST_ID"

            - name: Show deployment URL
              run: |
                  URL=$(aws cloudformation describe-stacks \
                    --stack-name nextjs-dev \
                    --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontURL`].OutputValue' \
                    --output text)
                  echo "Deployed to: $URL"
