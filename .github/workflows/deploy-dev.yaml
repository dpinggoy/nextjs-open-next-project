name: Deploy Dev

on:
    push:
        branches: [dev]
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: development

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npx tsc --noEmit

            - name: Test
              run: npm test
              continue-on-error: true

            - run: npm run build

            - run: npm run build:open-next

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - run: npm run cdk:deploy:dev

            - name: Get deployment URL
              id: get-url
              run: |
                  URL=$(aws cloudformation describe-stacks \
                    --stack-name nextjs-dev \
                    --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontURL`].OutputValue' \
                    --output text)
                  echo "url=$URL" >> $GITHUB_OUTPUT
                  echo "CloudFront URL: $URL"

            - name: Invalidate CloudFront cache
              run: |
                  URL="${{ steps.get-url.outputs.url }}"
                  DOMAIN=$(echo $URL | sed 's|https://||' | sed 's|http://||' | sed 's|/||')
                  echo "Looking for distribution with domain: $DOMAIN"

                  DIST_ID=$(aws cloudfront list-distributions \
                    --query "DistributionList.Items[?DomainName=='$DOMAIN'].Id | [0]" \
                    --output text)

                  if [ "$DIST_ID" != "None" ] && [ -n "$DIST_ID" ]; then
                    echo "Found distribution ID: $DIST_ID"
                    aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
                    echo "Cache invalidated successfully"
                  else
                    echo "Could not find distribution ID, skipping invalidation"
                  fi

            - name: Show deployment URL
              run: echo "Deployed to ${{ steps.get-url.outputs.url }}"
